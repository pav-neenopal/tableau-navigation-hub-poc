<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Edit</title>
<script src="tableau.extensions.1.latest.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;font-size:13px;color:#1f2937;background:#f4f6f9}
.wrap{display:flex;flex-direction:column;height:100vh}
.head{padding:14px 18px;background:#fff;border-bottom:1px solid #e3e7ed}
.head h2{margin:0;font-size:16px;font-weight:650}
.body{flex:1;overflow:auto;padding:14px 18px}
.card{background:#fff;border:1px solid #e3e7ed;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6b7686}
.field{margin-bottom:10px;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:600;color:#3b4656;margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;padding:8px 9px;border:1px solid #d0d5dd;border-radius:7px;font:inherit;background:#fff}
input:focus,select:focus{outline:2px solid #2f80ed55;border-color:#2f80ed}
.crow{display:flex;align-items:center;gap:10px}
input[type=color]{width:38px;height:34px;padding:2px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;cursor:pointer}
input[type=color]:disabled{opacity:.35;cursor:not-allowed}
.chk{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;cursor:pointer}
.chk input{width:15px;height:15px;margin:0}
.preview{border:1px dashed #cfd6e0;border-radius:7px;padding:9px 11px;margin-bottom:10px;background:#fafbfc;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;background:#fff;border-top:1px solid #e3e7ed}
button{padding:8px 18px;border-radius:7px;border:1px solid #d0d5dd;background:#fff;cursor:pointer;font:inherit;font-weight:600;color:#344054}
button.primary{background:#27364b;color:#fff;border-color:#27364b}
button:hover{filter:brightness(.97)}
</style></head>
<body><div class="wrap"><div class="head"><h2 id="heading">Edit</h2></div><div class="body" id="fields"></div>
<div class="foot"><button id="cancel">Cancel</button><button id="save" class="primary">Save</button></div></div>
<script src="dialog.js"></script></body></html>
