<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Edit</title>
<script src="tableau.extensions.1.latest.js"></script>
<style>body{font-family:Segoe UI,Arial,sans-serif;font-size:14px;padding:18px;color:#1f2937}h2{margin:0 0 14px;font-size:16px}label{display:block;font-weight:600;font-size:12px;margin:12px 0 4px}input,select{width:100%;padding:8px;border:1px solid #d0d5dd;border-radius:6px;font:inherit;box-sizing:border-box}input[type=color]{height:38px;padding:2px}.row{display:flex;gap:8px;margin-top:20px}button{flex:1;padding:9px;border-radius:7px;border:1px solid #d0d5dd;background:#fff;cursor:pointer;font:inherit;font-weight:600}button.primary{background:#27364b;color:#fff;border-color:#27364b}fieldset{border:1px solid #e2e6ec;border-radius:8px;margin:0 0 12px;padding:2px 12px 12px}legend{font-weight:700;font-size:12px;color:#596579}.crow{display:flex;align-items:center;gap:12px}.crow input[type=color]{width:70px}.chk{display:flex;align-items:center;gap:5px;margin:0;font-weight:400}.chk input{width:auto}#fields{max-height:calc(100vh - 110px);overflow:auto}</style></head>
<body><h2 id="heading">Edit</h2><div id="fields"></div>
<div class="row"><button id="cancel">Cancel</button><button id="save" class="primary">Save</button></div>
<script src="dialog.js"></script></body></html>
